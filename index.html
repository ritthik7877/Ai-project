<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction Fraud Detection System</title>
<style>
  :root {
    --bg: #f2efe8;
    --panel: #ffffff;
    --ink: #1c1c1c;
    --muted: #6b6b64;
    --header: #1c1c1c;
    --danger: #cc2b2b;
    --danger-bg: #fbe1e1;
    --safe: #1f8a4c;
    --safe-bg: #e2f5e8;
    --warn: #b9770e;
    --warn-bg: #fbeed7;
    --border: #e1ddd1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--header);
    color: #fff;
    padding: 18px 28px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding: 32px;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }
  .result-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .result-card, .form-card, .summary-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
  }
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 260px;
    color: var(--muted);
    font-size: 15px;
  }
  .result-card {
    text-align: center;
  }
  .verdict-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-size: 28px;
    font-weight: 700;
  }
  .verdict-icon.fraud { background: var(--danger-bg); color: var(--danger); }
  .verdict-icon.legit { background: var(--safe-bg); color: var(--safe); }
  .verdict-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .verdict-sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 18px;
  }
  .verdict-prob {
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
  }
  .verdict-prob.fraud { color: var(--danger); }
  .verdict-prob.legit { color: var(--safe); }
  .verdict-prob-label {
    color: var(--muted);
    font-size: 13px;
    margin: 6px 0 18px;
  }
  .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  .badge.high { background: var(--danger-bg); color: var(--danger); }
  .badge.medium { background: var(--warn-bg); color: var(--warn); }
  .badge.low { background: var(--safe-bg); color: var(--safe); }
  .summary-card h3 {
    margin: 0 0 12px;
    font-size: 15px;
  }
  .summary-card p {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: #3a3a35;
  }
  .form-card h2 {
    margin: 0 0 20px;
    font-size: 16px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 20px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
  }
  .field input:focus, .field select:focus {
    outline: 2px solid #1c1c1c;
    outline-offset: 1px;
  }
  button.predict {
    grid-column: 1 / -1;
    margin-top: 6px;
    background: var(--header);
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.predict:hover { opacity: 0.9; }
  button.predict:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>Transaction Fraud Detection System</header>

<div class="layout">
  <div class="result-panel" id="resultPanel">
    <div class="result-card">
      <div class="placeholder" id="placeholder">Enter transaction details and click Predict</div>
      <div id="resultContent" style="display:none;">
        <div class="verdict-icon" id="verdictIcon"></div>
        <div class="verdict-title" id="verdictTitle"></div>
        <div class="verdict-sub">Fraud Detection Analysis</div>
        <div class="verdict-prob" id="verdictProb"></div>
        <div class="verdict-prob-label">Fraud Probability</div>
        <span class="badge" id="riskBadge"></span>
      </div>
    </div>
    <div class="summary-card" id="summaryCard" style="display:none;">
      <h3>Analysis Summary</h3>
      <p id="summaryText"></p>
    </div>
  </div>

  <div class="form-card">
    <h2>Transaction Details</h2>
    <div class="form-grid">
      <div class="field">
        <label>Amount ($)</label>
        <input type="number" id="amount" placeholder="e.g. 5000">
      </div>
      <div class="field">
        <label>Hours Since Last Transaction</label>
        <input type="number" step="0.1" id="hoursSince" placeholder="e.g. 4">
      </div>
      <div class="field">
        <label>Transactions in Last 24h</label>
        <input type="number" id="txns24h" placeholder="e.g. 3">
      </div>
      <div class="field">
        <label>New Destination?</label>
        <select id="newDest">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>
      <div class="field">
        <label>Hour of Day (0-23)</label>
        <input type="number" id="hourOfDay" min="0" max="23" placeholder="e.g. 14">
      </div>
      <div class="field">
        <label>Old Balance (Origin)</label>
        <input type="number" id="oldOrig" placeholder="e.g. 10000">
      </div>
      <div class="field">
        <label>New Balance (Origin)</label>
        <input type="number" id="newOrig" placeholder="e.g. 5000">
      </div>
      <div class="field">
        <label>Old Balance (Destination)</label>
        <input type="number" id="oldDest" placeholder="e.g. 0">
      </div>
      <div class="field">
        <label>New Balance (Destination)</label>
        <input type="number" id="newDestBal" placeholder="e.g. 5000">
      </div>
      <div class="field">
        <label>Transaction Type</label>
        <select id="txnType">
          <option value="">Select Type</option>
          <option value="PAYMENT">Payment</option>
          <option value="TRANSFER">Transfer</option>
          <option value="CASH_OUT">Cash Out</option>
          <option value="CASH_IN">Cash In</option>
          <option value="DEBIT">Debit</option>
        </select>
      </div>
      <button class="predict" id="predictBtn">Predict Fraud Risk</button>
    </div>
    <div class="error" id="errorMsg" style="display:none;"></div>
  </div>
</div>

<script>
  const API_URL = "http://127.0.0.1:8000/predict";

  document.getElementById("predictBtn").addEventListener("click", async () => {
    const errorEl = document.getElementById("errorMsg");
    errorEl.style.display = "none";

    const payload = {
      amount: parseFloat(document.getElementById("amount").value),
      hoursSinceLastTransaction: parseFloat(document.getElementById("hoursSince").value),
      transactionsLast24h: parseInt(document.getElementById("txns24h").value),
      isNewDestination: document.getElementById("newDest").value === "Yes",
      hourOfDayInput: parseInt(document.getElementById("hourOfDay").value),
      oldbalanceOrg: parseFloat(document.getElementById("oldOrig").value),
      newbalanceOrig: parseFloat(document.getElementById("newOrig").value),
      oldbalanceDest: parseFloat(document.getElementById("oldDest").value),
      newbalanceDest: parseFloat(document.getElementById("newDestBal").value),
      type: document.getElementById("txnType").value,
    };

    for (const [k, v] of Object.entries(payload)) {
      if (v === "" || (typeof v === "number" && Number.isNaN(v))) {
        errorEl.textContent = "Please fill in all fields before predicting.";
        errorEl.style.display = "block";
        return;
      }
    }

    const btn = document.getElementById("predictBtn");
    btn.disabled = true;
    btn.textContent = "Predicting...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error("API error " + res.status);
      const data = await res.json();
      renderResult(data);
    } catch (err) {
      errorEl.textContent = "Could not reach the prediction API. Is the FastAPI server running on port 8000? (" + err.message + ")";
      errorEl.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "Predict Fraud Risk";
    }
  });

  function renderResult(data) {
    document.getElementById("placeholder").style.display = "none";
    document.getElementById("resultContent").style.display = "block";
    document.getElementById("summaryCard").style.display = "block";

    const icon = document.getElementById("verdictIcon");
    const title = document.getElementById("verdictTitle");
    const prob = document.getElementById("verdictProb");
    const badge = document.getElementById("riskBadge");

    if (data.isFraud) {
      icon.className = "verdict-icon fraud";
      icon.textContent = "\u2716";
      title.textContent = "FRAUD";
      prob.className = "verdict-prob fraud";
    } else {
      icon.className = "verdict-icon legit";
      icon.textContent = "\u2714";
      title.textContent = "LEGITIMATE";
      prob.className = "verdict-prob legit";
    }
    prob.textContent = data.fraudProbability.toFixed(2) + "%";

    const level = data.riskLevel.toLowerCase();
    badge.textContent = data.riskLevel;
    badge.className = "badge " + (level.includes("high") ? "high" : level.includes("medium") ? "medium" : "low");

    document.getElementById("summaryText").textContent = data.analysisSummary;
  }
</script>

</body>
</html>
